name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Yosys (auto)
        uses: ./
        with:
          version: "0.71"

      - name: Report version
        run: |
          yosys -V
          yosys -V | grep -F "Yosys 0.71"

      - name: Smoke synth
        run: |
          cat > t.v << 'EOF'
          module t(input wire a, output wire y);
            assign y = ~a;
          endmodule
          EOF
          yosys -p "read_verilog t.v; hierarchy; proc; synth; stat" | grep -F "1 cells"